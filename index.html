<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .calculator { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; font-size: 16px; }
        .result { font-weight: bold; font-size: 18px; margin-top: 10px; color: #333; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="First Number">
    <input type="number" id="num2" placeholder="Second Number">
    
    <select id="operator">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (*)</option>
        <option value="/">Division (/)</option>
    </select>
    
    <button onclick="calculate()">Calculate</button>
    
    <div id="result" class="result"></div>
</div>

<script>
    function calculate() {
        const num1Str = document.getElementById('num1').value;
        const num2Str = document.getElementById('num2').value;
        const operator = document.getElementById('operator').value;
        const resultDiv = document.getElementById('result');

        resultDiv.className = 'result';

        if (num1Str === '' || num2Str === '') {
            resultDiv.className = 'result error';
            resultDiv.innerText = 'Please enter both numbers.';
            return;
        }

        const num1 = parseFloat(num1Str);
        const num2 = parseFloat(num2Str);

        if (operator === '/' && num2 === 0) {
            resultDiv.className = 'result error';
            resultDiv.innerText = 'Error: Division by zero is not allowed.';
            return;
        }

        let res;
        switch (operator) {
            case '+': res = num1 + num2; break;
            case '-': res = num1 - num2; break;
            case '*': res = num1 * num2; break;
            case '/': res = num1 / num2; break;
        }

        resultDiv.innerText = `Result: ${res}`;
    }
</script>
</body>
</html>
